# Builds the mod on every push. This version installs Gradle itself, so it does NOT need gradle/wrapper/gradle-wrapper.jar
# in the repository, and it finds the project folder even if the files were uploaded inside a subfolder.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: find the project folder
        id: proj
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle was not found. The project files (build.gradle, settings.gradle, src/ ...) are not in the repository."
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - name: build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: ${{ steps.proj.outputs.dir }}/build/libs/
