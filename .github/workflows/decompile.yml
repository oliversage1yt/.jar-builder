# OPTIONAL helper. Run this manually (Actions tab -> "decompile-minecraft" -> Run workflow) to get Minecraft's
# decompiled source as a downloadable artifact. Handy for checking exact class and method names when the build fails.
name: decompile-minecraft
on: [workflow_dispatch]

jobs:
  decompile:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: find the project folder
        id: proj
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle | head -n 1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: generate sources
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle genSources --no-daemon
      - name: collect minecraft sources
        run: |
          mkdir -p decompiled
          find . ~/.gradle -name '*sources*.jar' -path '*minecraft*' -not -path './build/*' -exec cp -v {} decompiled/ \; || true
          ls -la decompiled
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-sources
          path: decompiled/
